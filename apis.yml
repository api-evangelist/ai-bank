aid: ai-bank
name: AI Bank
description: 'AI Bank (aiBank, 百信银行 / 中信百信银行股份有限公司 — CITIC aiBank Co., Ltd.) is a
  Beijing-based digital direct bank, launched in November 2017 as China''s first independent
  legal-person direct bank, a joint venture founded by China CITIC Bank and Baidu. It operates
  with no physical branches, serving retail customers — particularly younger consumers — and
  small and micro enterprises entirely through digital channels. Its own site describes the
  business lines as wealth management (财富管理), consumer finance (消费金融), industrial digital
  finance (产业数字金融), bills and notes (票据业务) and ecosystem finance (生态金融). The bank is
  positioned as an open-banking operator that embeds banking capability into partner platforms,
  but it publishes no public developer portal, API reference or machine-readable specification;
  its integration surface is reached through partner business agreements rather than public
  self-service onboarding.'
